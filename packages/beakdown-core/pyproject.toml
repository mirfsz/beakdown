[project]
name = "beakdown-core"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["duckdb>=1.4,<2", "pyarrow>=19", "pydantic>=2", "fastapi>=0.115", "uvicorn>=0.34", "websockets>=14", "pillow>=11"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/beakdown_core"]
