[project]
name = "beakdown-workspace"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["beakdown-core", "beakdown-mcp"]
[tool.uv.workspace]
members = ["packages/beakdown-core", "packages/beakdown-mcp"]
[tool.uv.sources]
beakdown-core = {workspace = true}
beakdown-mcp = {workspace = true}
[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]
[tool.pytest.ini_options]
testpaths = ["tests"]
