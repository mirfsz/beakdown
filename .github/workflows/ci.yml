name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: uv sync --locked
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: uv run pytest
      - name: Install browser for investigation smoke test
        run: uv run --with playwright playwright install --with-deps chromium
      - name: Verify investigation in browser
        run: uv run --with playwright python tests/browser_smoke.py
        env:
          BEAKDOWN_BROWSER: chromium
